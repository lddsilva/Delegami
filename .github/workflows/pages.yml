name: Anteprima su GitHub Pages

# Preview deployment only. The production site is Vercel on delegami.ch —
# this exists so the site can be opened from any device before that is set up.
on:
  push:
    branches: ['claude/admin-service-builders-l91i2w', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Grouped per ref: a push to one branch used to cancel a run already going on
# another, which is how the first good build got killed before it could deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      # basePath does not rewrite url() inside CSS, so the self-hosted fonts
      # would 404 under the /Delegami sub-path. Fix the built stylesheet rather
      # than hardcoding the sub-path in the source, which Vercel must not have.
      - name: Point font URLs at the sub-path
        run: |
          find out/_next -name '*.css' -print0 | xargs -0 sed -i \
            's|url(/fonts/|url(/Delegami/fonts/|g'

      # The preview must never compete with delegami.ch in Google once the real
      # domain is live, so the whole Pages copy is excluded from indexing.
      - name: Block indexing of the preview
        run: |
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          find out -name '*.html' -print0 | xargs -0 sed -i \
            's|<head>|<head><meta name="robots" content="noindex,nofollow">|'

      # enablement: true lets the workflow turn Pages on itself, with the
      # repository's own token. Added on the owner's explicit instruction.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # The github-pages environment only accepts deployments from the default
  # branch, so other branches build (catching breakage early) but stop there.
  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
